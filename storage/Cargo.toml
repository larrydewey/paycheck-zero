[package]
name = "paycheckzero-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PaycheckZero persistence adapter: SQLite (primary), PostgreSQL and MariaDB via sqlx."

[dependencies]
paycheckzero-core = { path = "../core" }
sqlx = { version = "0.8", default-features = false, features = ["any", "sqlite", "postgres", "mysql", "runtime-tokio", "tls-rustls"] }
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
