[package]
name = "paycheckzero-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PaycheckZero web server: Axum + Datastar, JWT auth, REST API, SSE, CSV export."

[dependencies]
paycheckzero-core = { path = "../core" }
paycheckzero-storage = { path = "../storage" }

axum = { version = "0.8", features = ["json", "form"] }
axum-extra = { version = "0.10", features = ["typed-header", "cookie"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tower = { version = "0.5" }
tower-http = { version = "0.6", features = ["trace"] }

serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
uuid = { workspace = true }
thiserror = { workspace = true }

jsonwebtoken = "9"
argon2 = "0.5"
