<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PaycheckZero</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0 auto; max-width: 900px; padding: 16px; color: #222; }
    .card { border: 1px solid #ccc; border-radius: 8px; padding: 8px 12px; min-width: 130px; }
    #summary-cards { display: flex; gap: 10px; flex-wrap: wrap; }
    .badge {
      display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 10px;
      background: #e8e8e8; color: #555; margin-left: 6px; text-transform: uppercase; letter-spacing: .5px;
    }
    .safe-to-spend { font-size: 22px; font-weight: 700; color: #0a7d33; }
    .paycheck, .category { border: 1px solid #d8d8d8; border-radius: 10px; padding: 12px; margin: 14px 0; }
    table { width: 100%; border-collapse: collapse; margin-top: 6px; }
    th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid #eee; }
    input[type=number], input[type=text] { width: 140px; box-sizing: border-box; }
    button { cursor: pointer; }
  </style>
</head>
<body>
  <main id="app"
        data-init="@get('/api/v1/ui/session')">
    <div id="auth-view"><p>Loading…</p></div>
  </main>

  <script>
    var PZ = {
      access: localStorage.getItem('pz.access'),
      refresh: localStorage.getItem('pz.refresh'),
    };

    function pzSetHeaders() {
      // Auth now rides on the HttpOnly pz_access cookie; nothing to set here.
    }

    function pzTokens(data) {
      PZ.access = data.access_token;
      PZ.refresh = data.refresh_token;
      localStorage.setItem('pz.access', PZ.access);
      localStorage.setItem('pz.refresh', PZ.refresh);
      pzSetHeaders();
    }

    function pzClear() {
      PZ.access = null; PZ.refresh = null;
      localStorage.removeItem('pz.access');
      localStorage.removeItem('pz.refresh');
      pzSetHeaders();
    }

    function pzShowError(msg) {
      var el = document.getElementById('auth-error');
      if (el) el.textContent = msg;
    }

    function pzPost(url, body) {
      return fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
    }

    function pzLogin(e) {
      e.preventDefault();
      var f = e.target;
      pzPost('/api/v1/auth/login', { email: f.email.value, password: f.password.value })
        .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
        .then(function (x) {
          if (!x.ok) throw new Error(x.d.error && x.d.error.message || 'login failed');
          pzTokens(x.d);
          location.reload();
        })
        .catch(function (err) { pzShowError(err.message); });
    }

    function pzRegister(e) {
      e.preventDefault();
      var f = e.target;
      pzPost('/api/v1/auth/register', { email: f.email.value, password: f.password.value })
        .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
        .then(function (x) {
          if (!x.ok) throw new Error(x.d.error && x.d.error.message || 'registration failed');
          pzTokens(x.d);
          location.reload();
        })
        .catch(function (err) { pzShowError(err.message); });
    }

    function pzLogout() {
      pzPost('/api/v1/auth/logout', { refresh_token: PZ.refresh })
        .then(pzClear)
        .then(function () { location.reload(); });
    }

    function pzNewMonth(e) {
      e.preventDefault();
      var f = e.target;
      pzPost('/api/v1/months', { year_month: f.year_month.value + '-01' })
        .then(function (r) { if (!r.ok) throw new Error('create month failed'); location.reload(); })
        .catch(function (err) { window.alert(err.message); });
    }

    // Month-level mutating actions: POST via auth'd fetch, then refetch the
    // month fragment by clicking the Datastar-refresh button (no full reload).
    function pzRefreshMonth(monthId) {
      var el = document.getElementById('month-refresh');
      if (el) el.click();
      else location.reload();
    }

    function pzAuthedPost(monthId, path, body) {
      return fetch('/api/v1/months/' + monthId + path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + PZ.access },
        body: JSON.stringify(body),
      });
    }

    function pzLock(monthId) {
      pzAuthedPost(monthId, '/lock', {})
        .then(function (r) { if (!r.ok) throw new Error('lock failed'); pzRefreshMonth(monthId); })
        .catch(function (err) { window.alert(err.message); });
    }

    function pzAddTransaction(e, monthId) {
      e.preventDefault();
      var f = e.target;
      pzAuthedPost(monthId, '/transactions', {
        date: f.date.value,
        amount: Number(f.amount.value),
        expense_line_id: f.expense_line_id.value || null,
        paycheck_id: f.paycheck_id.value || null,
      })
        .then(function (r) { if (!r.ok) throw new Error('add transaction failed'); pzRefreshMonth(monthId); })
        .catch(function (err) { window.alert(err.message); });
    }

    function pzAddLine(e, monthId) {
      e.preventDefault();
      var f = e.target;
      pzAuthedPost(monthId, '/expense-lines', { category_id: f.category_id.value, name: f.name.value })
        .then(function (r) { if (!r.ok) throw new Error('add expense line failed'); pzRefreshMonth(monthId); })
        .catch(function (err) { window.alert(err.message); });
    }

    // Category collapse-state persistence across fragment merges/reloads.
    document.addEventListener('toggle', function (e) {
      var d = e.target;
      if (d && d.id && d.classList.contains('category')) {
        try { localStorage.setItem('pz.cat.' + d.id, d.open ? '1' : '0'); } catch (_) {}
      }
    });
    function pzApplyCategoryState() {
      document.querySelectorAll('details.category').forEach(function (d) {
        var v = localStorage.getItem('pz.cat.' + d.id);
        if (v !== null) d.open = v === '1';
      });
    }
    var pzObserver = new MutationObserver(function () { pzApplyCategoryState(); });
    if (document.body) {
      pzApplyCategoryState();
      pzObserver.observe(document.body, { childList: true, subtree: true });
    }

    // Refresh the access token synchronously before Datastar boots so the first
    // fragment load uses a fresh token. Saves a login prompt on restore.
    pzSetHeaders();
    if (PZ.refresh) {
      try {
        var xhr = new XMLHttpRequest();
        xhr.open('POST', '/api/v1/auth/refresh', false);
        xhr.setRequestHeader('Content-Type', 'application/json');
        xhr.send(JSON.stringify({ refresh_token: PZ.refresh }));
        if (xhr.status === 200) pzTokens(JSON.parse(xhr.responseText));
        else pzClear();
      } catch (_) { pzClear(); }
    }
  </script>

  <script type="module" src="/static/datastar.js"></script>
</body>
</html>
