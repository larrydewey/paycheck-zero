name: Publish image

# Publishing is tied to a version tag: pushing v1.2.3 builds the image and moves
# the `1.2.3`, `1.2`, `v1.2.3` and `latest` tags on ghcr.io. `workflow_dispatch`
# re-runs the build for an existing ref without needing a new tag. Untagged
# pushes to master do nothing, so ordinary commits never publish.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# `packages: write` is what lets a run push to ghcr.io. `contents: read` is all
# it needs beyond that, so keeping the permissions minimal means a compromised
# action cannot push commits or change settings.
permissions:
  contents: read
  packages: write

jobs:
  # Each architecture builds on its own native runner, so there is no QEMU
  # emulation and neither build waits on the other. Both push a digest-only
  # image; the merge job ties the two digests into one manifest list. Native
  # arm64 runners are free and unlimited on public repositories.
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value={{raw_ref_name}}
            type=semver,pattern={{major}}.{{minor}},value={{raw_ref_name}}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=sha-${{ github.sha }},enable=${{ !startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Publishes the manifest list that ties both architectures to one tag. Until
  # this succeeds the individual digests stay unreferenced, so a failed arm64
  # build never leaves a half-published `latest` behind.
  merge:
    name: Publish manifest list
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value={{raw_ref_name}}
            type=semver,pattern={{major}}.{{minor}},value={{raw_ref_name}}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=sha-${{ github.sha }},enable=${{ !startsWith(github.ref, 'refs/tags/v') }}

      # One digest file per architecture. `imagetools create` is handed both the
      # tags to move and the `repo@sha256:…` refs to point them at.
      - name: Create and push manifest list
        id: manifest
        working-directory: /tmp/digests
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<< '${{ steps.meta.outputs.json }}')
          mapfile -t digests < <(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s\n' *)

          args=()
          for tag in "${tags[@]}"; do
            args+=(-t "$tag")
          done

          docker buildx imagetools create "${args[@]}" "${digests[@]}"

          echo "primary=${tags[0]}" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "${tags[0]}"

      - name: Write summary
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Pull: \`docker pull ${{ steps.manifest.outputs.primary }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
