[workspace]
resolver = "2"
members = ["core", "storage", "web"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Used by the Dockerfile: much quicker and lighter to build than release
# (fat LTO with one codegen unit is slow and memory-hungry on small machines),
# for a slightly larger binary that runs about as fast.
[profile.docker]
inherits = "release"
lto = "thin"
codegen-units = 16
